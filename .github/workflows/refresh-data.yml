name: Refresh public Radar data

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refresh public files
        run: python scripts/refresh.py
      - name: Rebuild readable notice pages
        run: python scripts/build_site.py
      - name: Verify pages and data
        run: python scripts/verify.py
      - name: Commit published changes
        run: |
          if git diff --quiet; then
            echo "No dataset change."
            exit 0
          fi
          git config user.name "tyllus-data-bot"
          git config user.email "team@tyllus.com"
          git add data index.html en tr it es sitemap.xml
          git commit -m "Refresh Radar dataset"
          git push
          GH_TOKEN="${{ github.token }}" gh api --method POST "repos/${{ github.repository }}/pages/builds"
